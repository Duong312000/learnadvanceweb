<table border="1" class="customer-table">
  <thead>
    <tr>
      <th>Id</th>
      <th>Name</th>
      <th>Email</th>
      <th>Age</th>
      <th>#</th>
    </tr>
  </thead>
  <tbody>
    <ng-container *ngFor="let g of customerGroups">
      <tr class="group-header">
        <td colspan="5">{{ g.CustomerTypeId }} - {{ g.CustomterTypeName }}</td>
      </tr>
      <tr *ngFor="let c of g.Customers">
        <td>{{ c.Id }}</td>
        <td>{{ c.Name }}</td>
        <td>{{ c.Email }}</td>
        <td>{{ c.Age }}</td>
        <td class="image-cell">
          <img [src]="c.Image" alt="{{ c.Name }}" width="120" style="max-height: 120px; object-fit: cover;">
        </td>
      </tr>
    </ng-container>
  </tbody>
</table>
