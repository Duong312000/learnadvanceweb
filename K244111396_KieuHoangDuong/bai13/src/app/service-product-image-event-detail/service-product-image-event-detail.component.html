<p>service-product-image-event-detail works!</p> 
<button (click)="goBack()">Go Back</button> 
<table border="1" *ngIf="selectedProduct" style="margin-top: 10px;"> 
    <tr> 
        <td>ID:</td> 
        <td>{{selectedProduct.ProductId}}</td> 
    </tr> 
    <tr> 
        <td>Name:</td> 
        <td>{{selectedProduct.ProductName}}</td> 
    </tr> 
    <tr> 
        <td>Price:</td> 
        <td>{{selectedProduct.Price}}</td> 
    </tr> 
    <tr> 
        <td colspan="2" style="text-align: center;"> 
            <img [src]="selectedProduct.Image" width="150" style="max-height: 150px; object-fit: contain;"/> 
        </td>         
    </tr> 
</table>
